name: zizmor

permissions: {}

# no paths filter: the check must report on every pull request to be required
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  zizmor:
    name: github actions security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # the SARIF upload exits 0 on findings, so it could never fail the
          # job; annotations make a finding fail the check
          advanced-security: false
          annotations: true
