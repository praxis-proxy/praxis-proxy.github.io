name: Update docs versions

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # starts the check workflow on the docs pull request branch (see below)
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          # tools/docs.py runs its own Git subprocesses; keep the token out of
          # the repository Git config since this job never pushes directly.
          persist-credentials: false

      - name: Refresh docs defaults and source pointers
        run: python3 tools/docs.py update-doc-versions
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Refresh development channel SHAs from tracked upstream refs
        run: python3 tools/docs.py update-dev-versions

      # Record refreshed source gitlinks so build validation sees the same
      # catalog and source revisions that will be proposed by the update PR.
      - name: Commit refreshed catalog and source pointers for validation
        run: |
          git add data/docs_versions.json sources/praxis sources/ai sources/policy sources/grid
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --signoff -m "chore: refresh documentation source snapshots"
          fi

      # Build and validate the updated snapshots before opening the PR. A PR
      # created with the default github.token does not trigger the pull_request
      # workflows (check.yml), so gate the docs here instead; a broken update
      # fails this run and no PR is opened.
      - name: Build and check the updated docs
        run: make check

      # Hand-written pages marked release-checked show readers a "checked
      # against" notice once their release is no longer the default; list them
      # in the PR so a maintainer can re-check and bump the marker.
      - name: Write pull request body
        run: |
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<'EOF'
          Automated run of `update-doc-versions` + `update-dev-versions`.

          - Promotes each project's docs default to the latest release eligible under each project's configured policy and moves the matching submodule pointer.
          - Refreshes the development channel SHAs (`development` in `data/docs_versions.json`) from each tracked upstream ref so the unreleased "Development" docs stay current.

          This PR is opened only after `make check` (build plus internal link/fragment and presentation checks) passes on the updated snapshots. Review the catalog and pointer changes before merging.
          EOF
          stale="$(python3 tools/check-authored-versions.py | grep '^warning:' || true)"
          if [ -n "$stale" ]; then
            cat >> "$body" <<'EOF'

          ### Hand-written pages to re-check

          These pages now show a "checked against" notice. Review their claims against the new release, then update their `release-checked` marker:

          EOF
            printf '%s\n' "$stale" | sed 's/^warning: /- /' >> "$body"
          fi
          printf '\n%s\n' '🤖 Generated with [Claude Code](https://claude.com/claude-code)' >> "$body"

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          signoff: true
          branch: automation/update-doc-versions
          title: "chore(website): update docs versions to latest releases"
          commit-message: "chore(website): update docs versions to latest releases"
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true

      # The pull request is opened with github.token, which fires no
      # pull_request events, so start the check workflow on its branch. Its run
      # checks the pull request's head commit, which is the required check for
      # this pull request. workflow_dispatch is the event github.token can use.
      - name: Run checks on the docs pull request
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh workflow run check.yml --ref automation/update-doc-versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      # GitHub waits for the ruleset's required checks before performing this
      # squash merge. Repository auto-merge is enabled for the docs updater.
      - name: Enable squash auto-merge on the docs pull request
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
