name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build website
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-build
          path: build
          retention-days: 3

  netlify-preview:
    # Same-repo PRs only — fork PRs cannot access Netlify secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-build
          path: build

      - name: Deploy preview to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ] || [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID repository secrets."
            exit 1
          fi

          npx --yes netlify-cli@23.9.1 deploy \
            --dir=build \
            --alias="deploy-preview-${{ github.event.pull_request.number }}" \
            --message="PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA:0:7}" \
            --json > netlify-deploy.json

          deploy_url=$(python3 -c 'import json; print(json.load(open("netlify-deploy.json"))["deploy_url"])')
          logs_url=$(python3 -c 'import json; print(json.load(open("netlify-deploy.json")).get("logs", ""))')
          echo "deploy_url=${deploy_url}" >> "$GITHUB_OUTPUT"
          echo "logs_url=${logs_url}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${deploy_url}"

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: netlify-preview
          message: |
            ### Netlify Deploy Preview

            | | |
            |---|---|
            | **Preview** | ${{ steps.netlify.outputs.deploy_url }} |
            | **Commit** | `${{ github.event.pull_request.head.sha }}` |
