<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="core-runtime-title core-runtime-desc">
  <title id="core-runtime-title">Pingora connects protocol adapters to upstreams; Praxis runs filters</title>
  <desc id="core-runtime-desc">Pingora accepts connections and invokes the Praxis protocol adapter. The adapter runs the listener's ordered pipeline, where built-in or custom HTTP and TCP filters choose an upstream. The adapter returns that target to Pingora, which connects and forwards traffic. Pingora owns connection handling; Praxis owns filter execution and routing.</desc>
  <defs>
    <marker id="runtime-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0 12 6 0 12Z" fill="#586579"/></marker>
  </defs>
  <rect width="1120" height="400" rx="16" fill="#f5f7fb"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <text x="40" y="43" fill="#182230" font-size="25" font-weight="600">Pingora owns connections; Praxis runs the filters</text>
    <text x="40" y="74" fill="#586579" font-size="17">The adapter hands a selected upstream back to Pingora to connect.</text>

    <rect x="240" y="111" width="470" height="180" rx="12" fill="#eef0ff" stroke="#4338ca" stroke-width="2"/>
    <text x="260" y="139" fill="#30279f" font-size="18" font-weight="600">Praxis runtime</text>

    <g fill="#fff" stroke="#dce2eb" stroke-width="2">
      <rect x="40" y="158" width="160" height="100" rx="10"/>
      <rect x="260" y="158" width="195" height="100" rx="10"/>
      <rect x="495" y="158" width="195" height="100" rx="10" stroke="#4338ca"/>
      <rect x="750" y="158" width="160" height="100" rx="10"/>
      <rect x="950" y="158" width="130" height="100" rx="10"/>
    </g>
    <g fill="#182230" font-size="19" font-weight="600">
      <text x="56" y="193">Pingora</text>
      <text x="276" y="193">Protocol adapter</text>
      <text x="511" y="193">Pipeline executor</text>
      <text x="766" y="193">Pingora</text>
      <text x="966" y="193">Upstream</text>
    </g>
    <g fill="#586579" font-size="17">
      <text x="56" y="220">accepts</text>
      <text x="56" y="243">connections</text>
      <text x="276" y="220">HTTP or TCP</text>
      <text x="276" y="243">callbacks</text>
      <text x="511" y="220">built-in or custom</text>
      <text x="511" y="243">HTTP / TCP filters</text>
      <text x="766" y="220">connects and</text>
      <text x="766" y="243">forwards traffic</text>
      <text x="966" y="220">selected</text>
      <text x="966" y="243">endpoint</text>
    </g>
    <g fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#runtime-arrow)">
      <path d="M200 208H260"/>
      <path d="M455 208H495"/>
      <path d="M690 208H750"/>
      <path d="M910 208H950"/>
    </g>
    <path d="M40 318H1080" stroke="#dce2eb" stroke-width="2"/>
    <text x="40" y="353" fill="#182230" font-size="18" font-weight="600">Connection handling</text>
    <text x="40" y="380" fill="#586579" font-size="17">Pingora owns it.</text>
    <text x="560" y="353" fill="#182230" font-size="18" font-weight="600">Filter execution and routing</text>
    <text x="560" y="380" fill="#586579" font-size="17">Praxis owns them.</text>
  </g>
</svg>
