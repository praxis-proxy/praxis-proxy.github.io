<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="core-reload-title core-reload-desc">
  <title id="core-reload-title">A valid reload swaps the active pipeline snapshot</title>
  <desc id="core-reload-desc">Praxis validates an edited configuration and builds a replacement snapshot before atomically swapping the active pointer. A request already in flight finishes on its pinned old snapshot, and a later request loads the new snapshot. If validation fails, the reload is rejected and the current snapshot remains active.</desc>
  <defs>
    <marker id="reload-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0 12 6 0 12Z" fill="#586579"/></marker>
    <marker id="reload-valid-arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 12 12"><path d="M0 0 12 6 0 12Z" fill="#4338ca"/></marker>
  </defs>
  <rect width="1120" height="440" rx="16" fill="#f5f7fb"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <text x="40" y="43" fill="#182230" font-size="25" font-weight="600">A reload changes the snapshot for new requests</text>
    <text x="40" y="74" fill="#586579" font-size="17">The active pipeline changes only after validation and a successful build.</text>

    <g fill="#fff" stroke="#dce2eb" stroke-width="2">
      <rect x="40" y="112" width="210" height="90" rx="10"/>
      <rect x="315" y="112" width="210" height="90" rx="10"/>
      <rect x="590" y="112" width="210" height="90" rx="10" stroke="#4338ca"/>
      <rect x="865" y="112" width="210" height="90" rx="10" stroke="#4338ca"/>
    </g>
    <g fill="#182230" font-size="20" font-weight="600">
      <text x="58" y="149">Edited config</text>
      <text x="333" y="149">Validate + build</text>
      <text x="608" y="149">New snapshot</text>
      <text x="883" y="149">Atomic swap</text>
    </g>
    <g fill="#586579" font-size="17">
      <text x="58" y="179">prepare the change</text>
      <text x="333" y="179">reject invalid edits</text>
      <text x="608" y="179">ready to activate</text>
      <text x="883" y="179">new pointer is active</text>
    </g>
    <g fill="none" stroke="#586579" stroke-width="2.5" marker-end="url(#reload-arrow)">
      <path d="M250 157H315"/>
      <path d="M525 157H590"/>
      <path d="M800 157H865"/>
    </g>
    <text x="558" y="143" text-anchor="middle" fill="#586579" font-size="17">valid</text>
    <path d="M420 202V224H205V270" fill="none" stroke="#586579" stroke-width="2" marker-end="url(#reload-arrow)"/>
    <text x="294" y="218" text-anchor="middle" fill="#586579" font-size="17">invalid</text>

    <g fill="#fff" stroke="#dce2eb" stroke-width="2">
      <rect x="40" y="270" width="330" height="132" rx="10"/>
      <rect x="395" y="270" width="330" height="132" rx="10"/>
      <rect x="750" y="270" width="330" height="132" rx="10" stroke="#4338ca"/>
      <rect x="58" y="330" width="112" height="54" rx="7" fill="#eef0ff" stroke="#c7c9f4" stroke-width="1.5"/>
      <rect x="228" y="330" width="124" height="54" rx="7"/>
      <rect x="413" y="330" width="124" height="54" rx="7"/>
      <rect x="583" y="330" width="124" height="54" rx="7"/>
      <rect x="768" y="330" width="124" height="54" rx="7" fill="#eef0ff" stroke="#c7c9f4" stroke-width="1.5"/>
      <rect x="938" y="330" width="124" height="54" rx="7" fill="#eef0ff" stroke="#c7c9f4" stroke-width="1.5"/>
    </g>
    <g fill="#182230" font-size="19" font-weight="600">
      <text x="58" y="302">Validation fails</text>
      <text x="413" y="302">Already in flight</text>
      <text x="768" y="302">Starts after swap</text>
    </g>
    <g fill="#182230" font-size="17">
      <text x="114" y="363" text-anchor="middle">Invalid edit</text>
      <text x="290" y="353" text-anchor="middle"><tspan x="290">Keep current</tspan><tspan x="290" dy="19">snapshot</tspan></text>
      <text x="475" y="353" text-anchor="middle"><tspan x="475">Running</tspan><tspan x="475" dy="19">request</tspan></text>
      <text x="645" y="353" text-anchor="middle"><tspan x="645">Old</tspan><tspan x="645" dy="19">snapshot</tspan></text>
      <text x="830" y="353" text-anchor="middle"><tspan x="830">New</tspan><tspan x="830" dy="19">request</tspan></text>
      <text x="1000" y="353" text-anchor="middle"><tspan x="1000">New</tspan><tspan x="1000" dy="19">snapshot</tspan></text>
    </g>
    <g fill="none" stroke="#586579" stroke-width="2" marker-end="url(#reload-arrow)">
      <path d="M170 357H228"/>
      <path d="M537 357H583"/>
      <path d="M892 357H938"/>
    </g>
    <text x="395" y="425" fill="#586579" font-size="17">An in-flight request finishes on its pinned snapshot; no request switches mid-flight.</text>
  </g>
</svg>
