<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="title desc">
  <title id="title">Praxis ecosystem components</title>
  <desc id="desc">Praxis is a runnable HTTP and TCP proxy with a Rust extension framework. Praxis AI is a gateway built on Praxis. Policy is an independent policy runtime that can connect at system boundaries when needed. These projects are released independently and are not a required sequence.</desc>
