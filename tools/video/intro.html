<!doctype html>
<!--
  Praxis introduction film. Every frame is a pure function of time:
  seek(t) sets the whole scene, so tools/video/render.cjs can capture it
  frame by frame. Open with ?t=12.5 to inspect a single moment.
  Product claims are checked against the Praxis default release; re-check
  them (and re-render) when the default moves on.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Praxis introduction</title>
<style>
@font-face { font-family: 'Plex'; src: url('../../static/fonts/IBMPlexSans-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Plex'; src: url('../../static/fonts/IBMPlexSans-SemiBold.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'PlexMono'; src: url('../../static/fonts/IBMPlexMono-Regular.woff2') format('woff2'); font-weight: 400; }
:root {
  --bg: #060a14; --panel: #0e1526; --panel2: #121b31; --line: #26304d; --text: #eef1ff; --muted: #97a1c6;
  --lav: #bcb4ff; --violet: #6d4cff; --blue: #3e69f8; --cyan: #16a7ed; --teal: #08d8ba; --bad: #ff6b81; --warn: #ffb35c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { font-family: 'Plex', system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#bg, #world, #ui { position: absolute; inset: 0; }
.orb { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; filter: blur(40px); will-change: transform; }
#orb1 { background: radial-gradient(circle, #3b2a9a66 0%, #3b2a9a00 62%); }
#orb2 { background: radial-gradient(circle, #0a8f9a40 0%, #0a8f9a00 60%); }
#grid { position: absolute; inset: 0; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 48px 48px; -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 55%, #000 0%, transparent 100%); }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 85% 80% at 50% 50%, transparent 55%, #02040acc 100%); }
svg { position: absolute; inset: 0; overflow: visible; }
.card-label { font: 600 25px 'Plex'; fill: var(--text); }
.card-sub { font: 400 16px 'PlexMono'; fill: var(--muted); }
.chip-title { font: 600 15px 'Plex'; letter-spacing: .14em; fill: var(--muted); }
.chip-val { font: 400 16px 'PlexMono'; fill: var(--text); }
.pkt-label { font: 400 17px 'PlexMono'; fill: var(--text); }
.core-title { font: 600 24px 'Plex'; fill: var(--text); letter-spacing: .02em; }
.core-meta { font: 400 15px 'PlexMono'; fill: var(--muted); }
.trace { font: 400 18px 'PlexMono'; fill: var(--lav); }
.head { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
.head h1 { font: 600 78px/1.06 'Plex'; letter-spacing: -.025em; }
.head p { margin-top: 18px; font: 400 32px/1.3 'Plex'; color: var(--muted); }
.w { display: inline-block; will-change: transform, opacity; white-space: pre; }
.grad { background: linear-gradient(90deg, #8f73ff, #3e8bfa 45%, #16c3e0 75%, #08d8ba); -webkit-background-clip: text; background-clip: text; color: transparent; }
.beat { position: absolute; left: 0; right: 0; top: 956px; text-align: center; font: 400 27px 'Plex'; color: var(--text); }
.beat b { font-weight: 600; color: var(--lav); }
.foot { position: absolute; left: 0; right: 0; bottom: 26px; text-align: center; font: 400 17px 'Plex'; color: #7d87ad; }
.panel { position: absolute; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(180deg, #111a2fee, #0b1222ee); box-shadow: 0 30px 80px #0008, inset 0 1px 0 #ffffff0d; overflow: hidden; }
.panel header { display: flex; justify-content: space-between; align-items: center; height: 58px; padding: 0 26px; border-bottom: 1px solid var(--line); font: 600 17px 'Plex'; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.panel header span:last-child { font: 400 17px 'PlexMono'; letter-spacing: 0; text-transform: none; color: var(--lav); }
.code { padding: 18px 26px; font: 400 22px/34px 'PlexMono'; white-space: pre; color: #c8cff0; }
.code .ln { display: block; height: 34px; border-radius: 6px; padding: 0 8px; margin: 0 -8px; }
.code.small { font-size: 19px; line-height: 30px; }
.code.small .ln { height: 30px; }
.k { color: #9fb4ff; } .s { color: #7fe3c9; } .n { color: #ffc27a; } .f { color: #d7b8ff; } .c { color: #6d779c; }

.out small { display: block; margin-bottom: 6px; font: 600 14px 'Plex'; letter-spacing: .14em; color: var(--muted); }
.caret { display: inline-block; width: 12px; height: 26px; margin-left: 3px; vertical-align: -4px; background: var(--teal); }
.pill { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border: 1px solid #343f63; border-radius: 99px; background: #0e1526cc; font: 400 19px 'Plex'; color: #d8ddf7; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.block { position: absolute; left: 0; width: 640px; height: 62px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; border: 1px solid #34406a; border-radius: 14px; background: linear-gradient(90deg, #17213d, #111a30); font: 400 21px 'PlexMono'; color: var(--text); }
.block em { font: 600 14px 'Plex'; font-style: normal; letter-spacing: .14em; color: var(--muted); }
.block.yours { border: 2px dashed #08d8ba; background: #08d8ba12; }
.block.yours em { color: var(--teal); }
#end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#end img { width: 600px; }
#end h2 { margin-top: 34px; font: 600 70px 'Plex'; letter-spacing: -.02em; }
#end .row { display: flex; gap: 14px; margin-top: 40px; }
#end .url { margin-top: 44px; font: 400 34px 'PlexMono'; color: var(--text); }
#end .url u { text-decoration: none; background: linear-gradient(90deg, #8f73ff, #08d8ba) bottom / 100% 3px no-repeat; padding-bottom: 6px; }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, #9d8cff55, transparent 55%); pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"><div class="orb" id="orb1"></div><div class="orb" id="orb2"></div><div id="grid"></div></div>
  <div id="world">
    <svg id="net" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <linearGradient id="spec" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#6d4cff"/><stop offset=".45" stop-color="#3e69f8"/><stop offset=".72" stop-color="#16a7ed"/><stop offset="1" stop-color="#08d8ba"/></linearGradient>
        <linearGradient id="coreFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1f45"/><stop offset="1" stop-color="#0d1328"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
      </defs>
      <g id="tangle"></g>
      <g id="wires"></g>
      <g id="cards"></g>
      <g id="core"></g>
      <g id="pkts"></g>
    </svg>
  </div>
  <div id="ui"></div>
  <div id="flash"></div>
  <div id="vignette"></div>
</div>
<script>
'use strict';
const DURATION = 48.5;
const NS = 'http://www.w3.org/2000/svg';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: x => 1 - Math.pow(1 - x, 3),
  in: x => x * x * x,
  io: x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  expo: x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),
  back: x => { const c = 1.5, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
// Visible between [a,b] fade-in and [c,d] fade-out.
const vis = (t, a, b, c, d) => Math.min(E.out(P(t, a, b)), 1 - E.in(P(t, c, d)));
const $ = s => document.querySelector(s);
function S(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function H(tag, cls, html, parent) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  if (parent) parent.appendChild(n);
  return n;
}
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const bez = (p0, p3, k = .5) => { const dx = (p3.x - p0.x) * k; return [p0, { x: p0.x + dx, y: p0.y }, { x: p3.x - dx, y: p3.y }, p3]; };
const bezAt = (b, u) => { const v = 1 - u; return { x: v*v*v*b[0].x + 3*v*v*u*b[1].x + 3*v*u*u*b[2].x + u*u*u*b[3].x, y: v*v*v*b[0].y + 3*v*v*u*b[1].y + 3*v*u*u*b[2].y + u*u*u*b[3].y }; };
const bezD = b => `M${b[0].x} ${b[0].y}C${b[1].x} ${b[1].y} ${b[2].x} ${b[2].y} ${b[3].x} ${b[3].y}`;

/* ---------- Cast ---------- */
const CY = 590;
const CLIENTS = [
  { name: 'Codex', sub: 'OpenAI Responses', color: '#16a7ed' },
  { name: 'Claude Code', sub: 'Anthropic Messages', color: '#b49bff' },
  { name: 'OpenCode', sub: 'Chat Completions', color: '#08d8ba' },
  { name: 'Your app', sub: 'OpenAI · Anthropic SDKs', color: '#ffb35c' },
  { name: 'Agents', sub: 'MCP · A2A', color: '#ff8fb3' },
];
const BACKENDS = [
  { name: 'vLLM', sub: 'self-hosted models' },
  { name: 'OpenAI', sub: 'native API' },
  { name: 'Anthropic', sub: 'native API' },
  { name: 'Azure OpenAI', sub: 'managed · Entra ID' },
  { name: 'AWS Bedrock', sub: 'Converse · SigV4' },
  { name: 'Vertex AI', sub: 'Gemini · Google ADC' },
  { name: 'Tools & agents', sub: 'MCP servers · A2A' },

const CW = 300, CH = 84, BH = 72;
CLIENTS.forEach((c, i) => { c.x = 110; c.y = CY + (i - 2) * 112; });
BACKENDS.forEach((b, i) => { b.x = 1510; b.y = CY + (i - 3) * 88; });
const cOut = c => ({ x: c.x + CW, y: c.y });
const bIn = b => ({ x: b.x, y: b.y });

function card(parent, item, h, left) {
  const g = S('g', {}, parent);
  const r = S('rect', { x: item.x, y: item.y - h / 2, width: CW, height: h, rx: 16, fill: '#0e1526', stroke: '#2a3456', 'stroke-width': 1.5 }, g);
  const dot = S('circle', { cx: item.x + 28, cy: item.y, r: 6, fill: item.color || '#5b6690' }, g);
  S('text', { x: item.x + 50, y: item.y - 4, class: 'card-label' }, g).textContent = item.name;
  S('text', { x: item.x + 50, y: item.y + 22, class: 'card-sub' }, g).textContent = item.sub;
  item.g = g; item.r = r; item.dot = dot; item.left = left; item.h = h;
}
const cardsG = $('#cards');
CLIENTS.forEach(c => card(cardsG, c, CH, true));
BACKENDS.forEach(b => card(cardsG, b, BH, false));

/* Tangle: every client to every backend, the world without a gateway. */
const tangleG = $('#tangle');
const TANGLE = [];
{
  const r = rng(7);
  CLIENTS.forEach((c, ci) => BACKENDS.forEach((b, bi) => {
    const p0 = cOut(c), p3 = bIn(b);
    const b4 = [p0, { x: lerp(p0.x, p3.x, .25 + r() * .3), y: p0.y + (r() - .5) * 520 }, { x: lerp(p0.x, p3.x, .45 + r() * .3), y: p3.y + (r() - .5) * 520 }, p3];
    const path = S('path', { d: bezD(b4), fill: 'none', stroke: ['#ff6b81', '#ffb35c', '#b49bff'][(ci + bi) % 3], 'stroke-width': 1.6, 'stroke-opacity': .5 }, tangleG);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    TANGLE.push({ path, len, b4, delay: r() * 1.4, speed: .5 + r() * .7, phase: r() });
  }));
}
const tangleDots = TANGLE.filter((_, i) => i % 2 === 0).map(tw => ({ tw, n: S('circle', { r: 3.5, fill: '#ffd1d9' }, tangleG) }));

/* Clean wires through the gateway. */
const wiresG = $('#wires');
const inWires = CLIENTS.map(() => S('path', { fill: 'none', stroke: 'url(#spec)', 'stroke-width': 2, 'stroke-opacity': .55 }, wiresG));
const outWires = BACKENDS.map(() => S('path', { fill: 'none', stroke: 'url(#spec)', 'stroke-width': 2, 'stroke-opacity': .55 }, wiresG));

/* Core gateway. */
const coreG = $('#core');
const coreHalo = S('rect', { rx: 40, fill: '#6d4cff', filter: 'url(#softglow)', opacity: .35 }, coreG);
const coreBox = S('rect', { rx: 26, fill: 'url(#coreFill)', stroke: 'url(#spec)', 'stroke-width': 2.5 }, coreG);
const coreIcon = S('image', { href: '../../static/images/branding/icon/white/praxis-icon-white.svg', width: 40, height: 44 }, coreG);
const coreTitle = S('text', { class: 'core-title' }, coreG); coreTitle.textContent = 'praxis';
const coreMeta = S('text', { class: 'core-meta', 'text-anchor': 'end' }, coreG); coreMeta.textContent = 'listener :8080';
const chainLine = S('line', { stroke: '#3a4673', 'stroke-width': 2, 'stroke-dasharray': '4 8' }, coreG);
const CHIPS = ['CLASSIFY', 'ROUTE', 'TRANSLATE', 'GUARD', 'BALANCE'].map((title, i) => {
  const g = S('g', {}, coreG);
  const glow = S('rect', { width: 148, height: 76, rx: 14, fill: '#6d4cff', filter: 'url(#softglow)', opacity: 0 }, g);
  const r = S('rect', { width: 148, height: 76, rx: 14, fill: '#121a33', stroke: '#33406b', 'stroke-width': 1.5 }, g);
  const tt = S('text', { class: 'chip-title', 'text-anchor': 'middle' }, g); tt.textContent = title;
  const v = S('text', { class: 'chip-val', 'text-anchor': 'middle' }, g);
  return { g, glow, r, tt, v, i };
});
const trace = S('text', { class: 'trace', 'text-anchor': 'middle' }, coreG);
const meterG = S('g', {}, coreG);
const meterBg = S('rect', { width: 420, height: 12, rx: 6, fill: '#1b2443' }, meterG);
const meterFill = S('rect', { width: 0, height: 12, rx: 6, fill: 'url(#spec)' }, meterG);
const meterLabel = S('text', { class: 'core-meta' }, meterG); meterLabel.textContent = 'token budget · per minute';
const meterVal = S('text', { class: 'core-meta', 'text-anchor': 'end' }, meterG);

/* Packets. */
const pktG = $('#pkts');
function makePkt() {
  const g = S('g', {}, pktG);
  const trail = [0, 1, 2, 3].map(k => S('circle', { r: 7 - k * 1.3, fill: '#bcb4ff', opacity: .5 - k * .1 }, g));
  const halo = S('circle', { r: 18, fill: '#8f73ff', filter: 'url(#softglow)', opacity: .9 }, g);
  const dot = S('circle', { r: 7, fill: '#fff' }, g);
  const lg = S('g', {}, g);
  const lr = S('rect', { height: 36, rx: 18, fill: '#0b1122', stroke: '#4a568a', 'stroke-width': 1.2 }, lg);
  const lt = S('text', { class: 'pkt-label' }, lg);
  return { g, trail, halo, dot, lg, lr, lt };
}
const PK = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(makePkt);
const chunks = Array.from({ length: 14 }, () => S('rect', { width: 14, height: 5, rx: 2.5, fill: '#08d8ba' }, pktG));
const ambient = Array.from({ length: 22 }, () => S('circle', { r: 3.4, fill: '#cfe9ff' }, pktG));

/* ---------- Headlines ---------- */
const ui = $('#ui');
function headline(title, sub, gradSub) {
  const d = H('div', 'head', null, ui);
  const h1 = H('h1', null, null, d);
  const words = title.split(' ').map((w, i, a) => H('span', 'w', w + (i < a.length - 1 ? ' ' : ''), h1));
  const p = H('p', null, null, d);
  const swords = sub.split(' ').map((w, i, a) => H('span', 'w' + (gradSub ? ' grad' : ''), w + (i < a.length - 1 ? ' ' : ''), p));
  if (gradSub) { p.style.font = "600 78px/1.06 'Plex'"; p.style.marginTop = '4px'; p.style.letterSpacing = '-.025em'; }

}
const HEADS = [
  { h: headline('Every client speaks its own API.', 'Every provider expects another.'), a: .45, s: 2.2, z: 5.0 },
  { h: headline('One gateway in between.', 'Composable by design.', true), a: 6.25, s: 7.15, z: 10.35 },
  { h: headline('Route by what a request contains.', 'API format, model and tool are classified before routing.'), a: 10.85, s: 11.5, z: 18.9 },
  { h: headline('Keep your client’s API.', 'Translate when the backend speaks another, streaming included.'), a: 19.35, s: 19.95, z: 26.7 },
  { h: headline('Policy in the path.', 'Credentials, guardrails and token budgets, enforced at the gateway.'), a: 27.05, s: 27.6, z: 35.2 },
  { h: headline('Built in Rust. Composed in YAML.', 'Chain the filters you need, or write your own.'), a: 35.65, s: 36.25, z: 42.5 },
];
function words(list, t, start, out) {
  list.forEach((w, i) => {
    const pin = E.out(P(t, start + i * .055, start + i * .055 + .55));
    const pout = E.in(P(t, out + i * .025, out + i * .025 + .35));
    w.style.opacity = Math.min(pin, 1 - pout);
    w.style.transform = `translateY(${(1 - pin) * 38 - pout * 24}px)`;
    w.style.filter = pin < 1 ? `blur(${(1 - pin) * 8}px)` : 'none';
  });
}

/* Beat captions & footnotes. */
const beatEl = H('div', 'beat', '', ui);
const footEl = H('div', 'foot', '', ui);
const BEATS = [
  { a: 11.5, z: 18.9, html: '' },
  { a: 27.6, z: 30.2, html: 'Clients send no provider key. <b>The gateway signs upstream.</b>' },
  { a: 30.4, z: 33.0, html: 'An external guardrail screens the prompt. <b>Blocked before inference.</b>' },
  { a: 33.2, z: 35.2, html: 'Token budgets per key, model or team. <b>Over budget, 429.</b>' },
];
const FOOTS = [
  { a: 1, z: 10.2, txt: 'Illustrative traffic.' },
  { a: 11, z: 26.6, txt: 'Illustrative traffic. Supported paths and limits are listed in the Praxis documentation.' },
  { a: 27.4, z: 35.2, txt: 'Guardrails call an external provider you configure. Token limits are an opt-in build feature.' },
  { a: 36.4, z: 42.5, txt: 'Illustrative chain. Filter names from the Praxis filter reference.' },
];

/* ---------- Translate scene panels ---------- */
const reqL = ['{', '  <span class="k">"model"</span>: <span class="s">"reviewer"</span>,', '  <span class="k">"system"</span>: <span class="s">"Be concise."</span>,', '  <span class="k">"max_tokens"</span>: <span class="n">1024</span>,', '  <span class="k">"stream"</span>: <span class="n">true</span>,', '  <span class="k">"messages"</span>: [', '    {<span class="k">"role"</span>: <span class="s">"user"</span>,', '     <span class="k">"content"</span>: <span class="s">"Review this diff"</span>}', '  ]', '}'];
const reqR = ['{', '  <span class="k">"model"</span>: <span class="s">"reviewer"</span>,', '  <span class="k">"max_tokens"</span>: <span class="n">1024</span>,', '  <span class="k">"stream"</span>: <span class="n">true</span>,', '  <span class="k">"messages"</span>: [', '    {<span class="k">"role"</span>: <span class="s">"system"</span>,', '     <span class="k">"content"</span>: <span class="s">"Be concise."</span>},', '    {<span class="k">"role"</span>: <span class="s">"user"</span>,', '     <span class="k">"content"</span>: <span class="s">"Review this diff"</span>}', '  ]', '}'];
const TOK = ['Looks', ' good,', ' one', ' nit.'];
const sseR = TOK.map(x => `<span class="c">data:</span> {<span class="k">"choices"</span>:[{<span class="k">"delta"</span>:{<span class="k">"content"</span>:<span class="s">"${x}"</span>}}]}`);
const sseL = TOK.flatMap(x => [`<span class="c">event:</span> <span class="f">content_block_delta</span>`, `<span class="c">data:</span> {<span class="k">"delta"</span>:{<span class="k">"type"</span>:<span class="s">"text_delta"</span>,<span class="k">"text"</span>:<span class="s">"${x}"</span>}}`]);
function panel(x, y, w, h, title, tag) {
  const p = H('div', 'panel', `<header><span>${title}</span><span>${tag}</span></header>`, ui);
  Object.assign(p.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });

}
const pL = panel(110, 318, 760, 560, 'Claude Code sends', 'POST /v1/messages');
const pR = panel(1050, 318, 760, 560, 'vLLM receives', 'POST /v1/chat/completions');
const codeL = H('div', 'code', reqL.map(l => `<span class="ln">${l}</span>`).join(''), pL);
const codeR = H('div', 'code', reqR.map(l => `<span class="ln">${l}</span>`).join(''), pR);
const sL = H('div', 'code small', sseL.map(l => `<span class="ln">${l}</span>`).join(''), pL);
const sR = H('div', 'code small', sseR.map(l => `<span class="ln">${l}</span>`).join(''), pR);
[sL, sR].forEach(n => Object.assign(n.style, { position: 'absolute', left: 0, right: 0, top: '58px' }));

  const conv = E.io(P(t, 21.5, 22.4));
  linesR.forEach((l, i) => { const k = E.out(P(t, 21.6 + i * .07, 21.9 + i * .07)); l.style.opacity = k; l.style.transform = `translateX(${(1 - k) * -20}px)`; l.style.background = ''; });
  const hl = vis(t, 22.2, 22.5, 23.2, 23.5);
  linesL[2].style.background = `rgba(143,115,255,${.28 * hl})`;
  [5, 6].forEach(i => (linesR[i].style.background = `rgba(8,216,186,${.22 * hl})`));
  // Link from the moved "system" field to its new place.
  const yL = 318 + 58 + 18 + 2 * 34 + 17, yR = 318 + 58 + 18 + 5.5 * 34 + 17;
  const link = [{ x: 590, y: yL }, { x: 760, y: yL }, { x: 1180, y: yR }, { x: 1330, y: yR }];
  tLink.setAttribute('d', `M${link[0].x} ${link[0].y}C${link[1].x} ${link[1].y} ${link[2].x} ${link[2].y} ${link[3].x} ${link[3].y}`);
  const ll = tLink.getTotalLength(); tLink.style.strokeDasharray = ll; tLink.style.strokeDashoffset = ll * (1 - E.io(P(t, 22.25, 22.9)));
  tLink.style.opacity = hl;
  // Request dot through the hub, then stream view.
  const req = P(t, 20.95, 21.65);
  const strm = P(t, 23.45, 23.9);
  hubLabel.textContent = t < 23.4 ? 'anthropic_messages_to_chat_completions' : 'anthropic_messages_to_chat_completions_stream';
  hubLabel.style.opacity = hubStem.style.opacity = vis(t, 20.6, 21.0, 26.0, 26.3);
  hubLabel.style.fontSize = '17px';
  [codeL, codeR].forEach(n => (n.style.opacity = 1 - strm));
  [sL, sR].forEach(n => (n.style.opacity = strm));
  pL.querySelector('header span:first-child').textContent = t < 23.6 ? 'Claude Code sends' : 'Claude Code receives';
  pL.querySelector('header span:last-child').textContent = t < 23.6 ? 'POST /v1/messages' : 'Anthropic event stream';
  pR.querySelector('header span:first-child').textContent = t < 23.6 ? 'vLLM receives' : 'vLLM streams';
  pR.querySelector('header span:last-child').textContent = t < 23.6 ? 'POST /v1/chat/completions' : 'chat.completion.chunk';
  let dot = null;
  if (req > 0 && req < 1) dot = { x: lerp(870, 1050, E.io(req)), y: 590 };
  TOK.forEach((_, i) => {
    const ta = 24.0 + i * .5;
    sRL[i].style.opacity = E.out(P(t, ta, ta + .2));
    const tb = ta + .3;
    sLL[i * 2].style.opacity = sLL[i * 2 + 1].style.opacity = E.out(P(t, tb, tb + .2));
    const m = P(t, ta + .05, tb);
    if (m > 0 && m < 1) dot = { x: lerp(1050, 870, E.io(m)), y: 590 };
  });
  hubDot.style.opacity = hubHalo.style.opacity = dot ? 1 : 0;
  if (dot) [hubDot, hubHalo].forEach(n => { n.setAttribute('cx', dot.x); n.setAttribute('cy', dot.y); });
  const shown = TOK.filter((_, i) => t >= 24.3 + i * .5 + .2).join('');
  $('#outtxt').textContent = shown;
  outL.style.opacity = E.out(P(t, 24.0, 24.3));
  outL.querySelector('.caret').style.opacity = Math.floor(t * 2.4) % 2 ? 0 : 1;

  /* Build scene. */
  const bO = vis(t, 35.9, 36.4, 42.3, 42.8);
  [yP, rsP, stack, chipsRow].forEach(n => { n.style.display = bO > 0 ? 'block' : 'none'; n.style.opacity = bO; });
  chipsRow.style.display = bO > 0 ? 'flex' : 'none';
  yP.style.transform = `translateY(${(1 - E.out(P(t, 35.9, 36.6))) * 40}px)`;
  let lastBlock = -1;
  yLines.forEach((l, i) => {
    const ta = 36.4 + i * .36;
    const k = P(t, ta, ta + .3);
    l.style.opacity = k > 0 ? 1 : 0;
    l.style.clipPath = `inset(0 ${100 - k * 100}% 0 0)`;
  });
  let bi = 0;
  YAML.forEach(([, b], i) => {
    if (!b) return;
    const el = BLOCKS[bi++];
    const ta = 36.4 + i * .36 + .25;
    const k = E.back(P(t, ta, ta + .45));
    el.style.opacity = clamp(P(t, ta, ta + .2));
    el.style.transform = `translateX(${(1 - k) * 120}px)`;
    if (t >= ta) lastBlock = bi - 1;
  });
  const yk = E.back(P(t, 39.9, 40.5));
  yours.style.opacity = clamp(P(t, 39.9, 40.1)); yours.style.transform = `translateY(${(1 - yk) * -30}px) scale(${lerp(1.06, 1, yk)})`;
  rsP.style.transform = `translateY(${(1 - E.out(P(t, 39.6, 40.3))) * 40}px)`;
  rsP.style.opacity = bO * E.out(P(t, 39.6, 40.1));
  const lineH = lastBlock >= 0 ? (Math.max(lastBlock, yours.style.opacity > .5 ? 6 : lastBlock) * 76 + (yours.style.opacity > .5 ? 12 : 0)) : 0;
  stackLine.style.height = lineH + 'px';
  const flow = (t * .45) % 1;
  stackDot.style.top = (30 - 8 + flow * Math.max(0, lineH)) + 'px';
  stackDot.style.opacity = t > 40.6 ? 1 : 0;
  BLOCKS.forEach((b, i) => { const near = Math.abs(flow * lineH - i * 76) < 30 && t > 40.6; b.style.borderColor = near ? '#bcb4ff' : ''; b.style.boxShadow = near ? '0 0 24px #8f73ff55' : ''; });
  chipEls.forEach((c, i) => { const k = E.out(P(t, 40.4 + i * .1, 40.9 + i * .1)); c.style.opacity = k; c.style.transform = `translateY(${(1 - k) * 18}px)`; });

  /* End card. */
  const eO = vis(t, 42.9, 43.4, 47.7, 48.4);
  end.style.display = eO > 0 ? 'flex' : 'none';
  endParts.forEach((p, i) => {
    const k = E.out(P(t, 42.9 + i * .28, 43.7 + i * .28));
    p.style.opacity = Math.min(k, 1 - E.in(P(t, 47.6, 48.3)));
    p.style.transform = `translateY(${(1 - k) * 30}px) scale(${i === 0 ? lerp(.92, 1, k) : 1})`;
    p.style.filter = k < 1 ? `blur(${(1 - k) * 10}px)` : 'none';
  });
}
window.DURATION = DURATION;
window.seek = seek;
const q = new URLSearchParams(location.search);
if (q.has('t')) seek(parseFloat(q.get('t')));
else if (q.has('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
else seek(7.6);
</script>
